name: CI

# Activates automatically once this repo is pushed to GitHub — nothing
# else to configure. Runs the same checks scripts/validate_state.py and
# .githooks/pre-commit already enforce locally, plus the full pytest suite
# (the tooling's own tests/, and, if present, any day's code/tests/).

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate state.json against state.schema.json
        run: python3 scripts/validate_state.py

      - name: Run tooling test suite (scripts/, tests/)
        run: pytest tests/ -v

      - name: Run any generated day/micro-project tests, if present
        run: |
          if find . -path ./node_modules -prune -o -path "*/code/tests" -print | grep -q .; then
            pytest --rootdir=. -v $(find . -path ./node_modules -prune -o -type d -path "*/code/tests" -print)
          else
            echo "No generated day content yet — nothing under code/tests/ to run."
          fi
